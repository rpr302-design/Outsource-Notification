<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outsource Notification Portal</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-center items-center">

    <!-- App Container -->
    <div class="w-full max-w-md bg-white h-full sm:h-[680px] sm:rounded-2xl shadow-xl flex flex-col overflow-hidden">

        <!-- 1. Registration / Login Screen -->
        <div id="registration-screen" class="p-6 flex flex-col justify-center h-full">
            <div class="text-center mb-8">
                <div class="bg-teal-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-md">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">नोटिफिकेशन ग्रुप</h2>
                <p class="text-sm text-gray-500 mt-1">महत्वपूर्ण सूचनाएं पाने के लिए अपना नाम और नंबर दर्ज करें</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">आपका नाम</label>
                    <input type="text" id="user-name" required placeholder="जैसे: रोशन प्रजापति" 
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">मोबाइल नंबर (10 अंक)</label>
                    <input type="tel" id="user-phone" pattern="[0-9]{10}" maxlength="10" required placeholder="9876543210" 
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>

                <button type="submit" id="submit-btn"
                        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md flex justify-center items-center">
                    <span>ग्रुप में शामिल हों</span> <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>

        <!-- 2. Chat / Notification Screen -->
        <div id="chat-screen" class="hidden flex-col h-full bg-[#efeae2]">
            
            <!-- Header -->
            <div class="bg-teal-700 text-white px-4 py-3 flex items-center justify-between shadow">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-teal-500 flex items-center justify-center font-bold text-lg border border-white/30">
                        <i class="fas fa-users"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base leading-tight">MP Outsource सूचना ग्रुप</h3>
                        <div class="flex items-center space-x-2 text-xs text-teal-200">
                            <span id="welcome-user">Admin Announcements</span>
                            <span>•</span>
                            <span id="user-count-badge" class="bg-teal-800 px-2 py-0.5 rounded-full text-[10px] text-teal-100 font-semibold border border-teal-500">
                                <i class="fas fa-user-friends mr-1"></i>0 Users
                            </span>
                        </div>
                    </div>
                </div>
                <button id="logout-btn" title="प्रोफाइल बदलें" class="text-teal-200 hover:text-white text-sm">
                    <i class="fas fa-sign-out-alt text-lg"></i>
                </button>
            </div>

            <!-- Messages Container -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-center text-xs text-gray-500 bg-amber-100 border border-amber-200 p-2 rounded-lg my-2">
                    🔒 यह एक ऑफिशियल ब्रॉडकास्ट ग्रुप है।
                </div>
                <div id="loading-spinner" class="text-center py-6 text-gray-500">
                    <i class="fas fa-circle-notch fa-spin text-2xl text-teal-600"></i>
                    <p class="text-xs mt-2">मैसेज लोड हो रहे हैं...</p>
                </div>
            </div>

            <!-- Admin Input Box (केवल एडमिन के लिए दिखेगा) -->
            <div id="admin-input-box" class="hidden bg-white p-3 border-t flex flex-col space-y-2">
                <input type="text" id="admin-msg-title" placeholder="सूचना का शीर्षक (Title)" class="px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-1 focus:ring-teal-500">
                <div class="flex items-center space-x-2">
                    <textarea id="admin-msg-body" rows="2" placeholder="नया नोटिफिकेशन मैसेज यहाँ लिखें..." class="flex-1 px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-1 focus:ring-teal-500 resize-none"></textarea>
                    <button id="send-btn" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-3 rounded-lg font-bold text-sm h-full flex items-center justify-center shadow">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Normal User Footer -->
            <div id="user-footer" class="bg-gray-200 px-4 py-3 text-center text-xs text-gray-600 border-t">
                <i class="fas fa-info-circle mr-1"></i> केवल एडमिन ही इस ग्रुप में संदेश भेज सकते हैं।
            </div>
        </div>

    </div>

    <!-- Firebase v10 SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDkQzYzWk1COIxNmd_VGqfHRsRtf9sOz8A",
            authDomain: "push-notifaction-c3460.firebaseapp.com",
            projectId: "push-notifaction-c3460",
            storageBucket: "push-notifaction-c3460.firebasestorage.app",
            messagingSenderId: "649136234508",
            appId: "1:649136234508:web:39b8e06150890d360ace29",
            measurementId: "G-5W02WYP1ZT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        // एडमिन मोबाइल नंबर
        const ADMIN_PHONE_NUMBER = "9993332211"; 

        let currentUser = null;

        // Service Worker Registration
        let swRegistration = null;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
                .then(reg => {
                    swRegistration = reg;
                    console.log('Firebase Hosting Service Worker Registered');
                })
                .catch(err => console.error('SW Fail:', err));
        }

        // Elements
        const regScreen = document.getElementById('registration-screen');
        const chatScreen = document.getElementById('chat-screen');
        const loginForm = document.getElementById('login-form');
        const userNameInput = document.getElementById('user-name');
        const userPhoneInput = document.getElementById('user-phone');
        const submitBtn = document.getElementById('submit-btn');
        const messagesContainer = document.getElementById('messages-container');
        const welcomeUserText = document.getElementById('welcome-user');
        const userCountBadge = document.getElementById('user-count-badge');
        const logoutBtn = document.getElementById('logout-btn');
        const adminInputBox = document.getElementById('admin-input-box');
        const userFooter = document.getElementById('user-footer');
        const sendBtn = document.getElementById('send-btn');

        // AUTO-LOGIN
        const savedUser = JSON.parse(localStorage.getItem('notification_user'));
        if (savedUser) {
            showChatScreen(savedUser);
        }

        // FCM Token
        async function getFCMToken() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const reg = swRegistration || await navigator.serviceWorker.ready;
                    const token = await getToken(messaging, { 
                        serviceWorkerRegistration: reg 
                    });
                    return token || "no_token";
                }
            } catch (err) {
                console.log("Token error:", err);
            }
            return "no_permission";
        }

        // फॉर्म सबमिट
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = userNameInput.value.trim();
            const phone = userPhoneInput.value.trim();

            if (phone.length !== 10) {
                alert('कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> चेक किया जा रहा है...`;

            const fcmToken = await getFCMToken();

            try {
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("phone", "==", phone));
                const querySnapshot = await getDocs(q);

                let userData = { name, phone, fcmToken, lastLogin: new Date().toISOString() };

                if (!querySnapshot.empty) {
                    const existingDoc = querySnapshot.docs[0];
                    await setDoc(doc(db, "users", existingDoc.id), {
                        fcmToken: fcmToken,
                        lastLogin: serverTimestamp()
                    }, { merge: true });

                    userData.name = existingDoc.data().name || name;
                } else {
                    await addDoc(collection(db, "users"), {
                        name,
                        phone,
                        fcmToken,
                        createdAt: serverTimestamp()
                    });
                }

                localStorage.setItem('notification_user', JSON.stringify(userData));
                showChatScreen(userData);

            } catch (error) {
                console.error("Auth error:", error);
                alert("साइन इन में समस्या आई, कृपया फ़ायरस्टोर रूल्स जांचें।");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>ग्रुप में शामिल हों</span> <i class="fas fa-arrow-right ml-2"></i>`;
            }
        });

        // चैट स्क्रीन और एडमिन पैनल
        function showChatScreen(user) {
            currentUser = user;
            regScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            chatScreen.classList.add('flex');
            welcomeUserText.innerText = `${user.name}`;

            if (user.phone === ADMIN_PHONE_NUMBER) {
                adminInputBox.classList.remove('hidden');
                userFooter.classList.add('hidden');
            }

            loadTotalUsersCount();
            loadNotifications();

            onMessage(messaging, (payload) => {
                alert(`📢 नया नोटिफिकेशन:\n${payload.notification.title}\n${payload.notification.body}`);
            });
        }

        // 1. कुल जुड़े यूज़र्स की संख्या (Real-time Count)
        function loadTotalUsersCount() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const total = snapshot.size;
                userCountBadge.innerHTML = `<i class="fas fa-user-friends mr-1"></i>${total} Users`;
            });
        }

        // 2. मैसेज लोड करें (डिलीट बटन एडमिन के लिए)
        function loadNotifications() {
            const q = query(collection(db, "notifications"), orderBy("timestamp", "asc"));

            onSnapshot(q, (snapshot) => {
                const spinner = document.getElementById('loading-spinner');
                if(spinner) spinner.remove();

                messagesContainer.innerHTML = `
                    <div class="text-center text-xs text-gray-500 bg-amber-100 border border-amber-200 p-2 rounded-lg my-2">
                        🔒 यह एक ऑफिशियल ब्रॉडकास्ट ग्रुप है।
                    </div>
                `;

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const msgTime = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'अभी';

                    const isAdmin = currentUser && currentUser.phone === ADMIN_PHONE_NUMBER;

                    messagesContainer.innerHTML += `
                        <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-teal-600 max-w-[90%] my-2 relative group">
                            <div class="text-xs font-bold text-teal-700 mb-1 flex justify-between items-center">
                                <span>📢 Admin Notification</span>
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] text-gray-400 font-normal">${msgTime}</span>
                                    ${isAdmin ? `<button onclick="deleteNotification('${docId}')" class="text-red-500 hover:text-red-700 text-xs ml-2 p-1" title="मैसेज डिलीट करें"><i class="fas fa-trash-alt"></i></button>` : ''}
                                </div>
                            </div>
                            ${data.title ? `<h4 class="font-bold text-sm text-gray-900 mb-1">${data.title}</h4>` : ''}
                            <p class="text-sm text-gray-800 whitespace-pre-wrap">${data.message}</p>
                        </div>
                    `;
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // एडमिन द्वारा मैसेज डिलीट करने का फंक्शन
        window.deleteNotification = async function(docId) {
            if (confirm("क्या आप इस नोटिफिकेशन को डिलीट करना चाहते हैं?")) {
                try {
                    await deleteDoc(doc(db, "notifications", docId));
                } catch (err) {
                    alert("डिलीट करने में समस्या आई: " + err.message);
                }
            }

        };

        // नया मैसेज पोस्ट करना
        if(sendBtn) {
            sendBtn.addEventListener('click', async () => {
                const title = document.getElementById('admin-msg-title').value.trim();
                const message = document.getElementById('admin-msg-body').value.trim();

                if (!message) {
                    alert("कृपया संदेश लिखें!");
                    return;
                }

                sendBtn.disabled = true;

                try {
                    await addDoc(collection(db, "notifications"), {
                        title: title || "महत्वपूर्ण सूचना",
                        message: message,
                        timestamp: serverTimestamp()
                    });

                    document.getElementById('admin-msg-title').value = '';
                    document.getElementById('admin-msg-body').value = '';
                    sendBtn.disabled = false;

                } catch (err) {
                    alert("मैसेज भेजने में समस्या आई: " + err.message);
                    sendBtn.disabled = false;
                }
            });
        }

        // लॉगआउट
        logoutBtn.addEventListener('click', () => {
            if (confirm("क्या आप लॉगआउट करके दूसरा नंबर बदलना चाहते हैं?")) {
                localStorage.removeItem('notification_user');
                location.reload();
            }
        });
    </script>
</body>
</html>
