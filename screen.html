<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4D Smart Auto-Fit LED Screen Player</title>
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #030712;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 4D हाइपर-स्पेस कैनवास बैकग्राउंड */
    #bg4dCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* टॉप प्रीमियम बार */
    #topBar {
      height: 65px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 35px;
      font-size: 24px;
      font-weight: 800;
      border-bottom: 2px solid rgba(0, 229, 255, 0.35);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .brand-title {
      background: linear-gradient(90deg, #00e5ff, #7c4dff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    #liveClock {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.4);
      padding: 6px 18px;
      border-radius: 12px;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
    }

    /* मुख्य डिस्प्ले एरिया */
    #mainScreen {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      overflow: hidden;
    }

    .media-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeInScale 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* 🟢 ऑटो-फ़िट मीडिया रैपर: केवल फोटो/कंटेंट के वास्तविक आकार जितना बनेगा */
    .auto-media-wrapper {
      max-width: 95%;
      max-height: 86%;
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(0, 229, 255, 0.5);
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.35), 0 0 70px rgba(124, 77, 255, 0.25);
      background: transparent;
      backdrop-filter: blur(5px);
    }

    /* फोटो अपने ओरिजिनल अनुपात में रहेगी, चारों तरफ 3D स्पेस खुला रहेगा */
    .auto-media-wrapper img {
      display: block;
      max-width: 92vw;
      max-height: 78vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
    }

    /* वीडियो और PDF के लिए फुल-फ्रेम */
    .video-pdf-wrapper {
      width: 92%;
      height: 86%;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(0, 229, 255, 0.5);
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.35);
      background: transparent;
    }

    .video-pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
    }

    /* 4D फ्लोटिंग विज्ञापन सूचना ओवरले */
    .ad-info-overlay {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid #ffd700;
      color: #ffffff;
      padding: 12px 38px;
      border-radius: 35px;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 215, 0, 0.5);
      white-space: nowrap;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
      to { box-shadow: 0 0 35px rgba(255, 215, 0, 0.7); }
    }

    /* नीचे रनिंग टिकर */
    #bottomTicker {
      height: 50px;
      background: linear-gradient(90deg, #990000, #ff0055, #990000);
      color: #ffffff;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      font-size: 22px;
      font-weight: bold;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(255, 0, 85, 0.4);
    }

    .marquee-text {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 25s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* लाइव स्टेटस सूचक */
    #debugStatus {
      position: fixed;
      bottom: 58px;
      right: 20px;
      background: rgba(10, 15, 30, 0.9);
      color: #00e5ff;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 8px;
      font-family: monospace;
      border: 1px solid rgba(0, 229, 255, 0.4);
      z-index: 150;
    }
  </style>
</head>
<body>

  <!-- 4D एनिमेटेड बैकग्राउंड कैनवास -->
  <canvas id="bg4dCanvas"></canvas>

  <!-- टॉप हेडर -->
  <div id="topBar">
    <div class="brand-title">
      <span>✨ नगर मुख्य डिजिटल स्मार्ट स्क्रीन</span>
    </div>
    <div id="liveClock">00:00:00</div>
  </div>

  <!-- मुख्य स्क्रीन एरिया -->
  <div id="mainScreen">
    <div style="font-size: 26px; color: #00e5ff; text-shadow: 0 0 15px rgba(0,229,255,0.7);">
      सिस्टम प्रारंभ हो रहा है...
    </div>
  </div>

  <!-- बॉटम रनिंग टिकर -->
  <div id="bottomTicker">
    <div class="marquee-text">
      📢 इस स्क्रीन पर जन्मदिन, सालगिरह, प्रतिष्ठान प्रचार व अन्य सूचनाएं दिखाने के लिए हमारी वेबसाइट से ऑनलाइन बुकिंग करें!
    </div>
  </div>

  <div id="debugStatus">तैयार हो रहा है...</div>

  <script>
    /* ==========================================================
       1. 4D HYPER-SPACE PARTICLES ENGINE (निरंतर 60 FPS एनिमेशन)
       ========================================================== */
    const canvas = document.getElementById("bg4dCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const particles = [];
    const PARTICLE_COUNT = 90;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        z: Math.random() * 1000,
        radius: Math.random() * 2.5 + 1,
        color: ['#00e5ff', '#7c4dff', '#ff007f', '#ffd700'][Math.floor(Math.random() * 4)],
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        vz: Math.random() * 2 + 1.2
      });
    }

    function render4DSpace() {
      ctx.fillStyle = "rgba(3, 7, 18, 0.25)";
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.z -= p.vz;
        p.x += p.vx;
        p.y += p.vy;

        if (p.z <= 0) {
          p.z = 1000;
          p.x = Math.random() * width;
          p.y = Math.random() * height;
        }

        const k = 400 / p.z;
        const px = (p.x - cx) * k + cx;
        const py = (p.y - cy) * k + cy;
        const pr = Math.max(0.1, p.radius * k);

        if (px >= 0 && px <= width && py >= 0 && py <= height) {
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = pr * 6;
          ctx.shadowColor = p.color;
          ctx.fill();
        }
      }
      requestAnimationFrame(render4DSpace);
    }
    render4DSpace();

    /* ==========================================================
       2. LIVE DIGITAL CLOCK
       ========================================================== */
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('hi-IN', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ==========================================================
       3. FIREBASE + LOCAL STORAGE CACHE ENGINE
       ========================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyDkQzYzWk1COIxNmd_VGqfHRsRtf9sOz8A",
      authDomain: "push-notifaction-c3460.firebaseapp.com",
      projectId: "push-notifaction-c3460",
      messagingSenderId: "649136234508",
      appId: "1:649136234508:web:39b8e06150890d360ace29",
      measurementId: "G-5W02WYP1ZT"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const CACHE_KEY = "screen_ads_cache_data";
    let currentAds = [];
    let currentIndex = 0;
    let slideTimer = null;
    const SLIDE_DURATION = 14000; // 14 सेकंड प्रति विज्ञापन

    function getTodayDateString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function cleanDriveId(rawString) {
      if (!rawString) return null;
      if (/^[a-zA-Z0-9_-]{25,}$/.test(rawString)) return rawString;
      const match = rawString.match(/\/d\/([a-zA-Z0-9_-]+)/) || rawString.match(/id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function detectMediaType(data) {
      const name = (data.originalFileName || "").toLowerCase();
      const type = (data.fileType || "").toLowerCase();
      if (name.endsWith(".pdf") || type.includes("pdf")) return "pdf";
      if (name.match(/\.(mp4|webm|mov|mkv)$/) || type.includes("video")) return "video";
      return "image";
    }

    // A. पहले लोकल स्टोरेज से तुरंत लोड करें
    function loadFromLocalStorage() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          const today = getTodayDateString();
          const validAds = parsed.filter(item => item.displayDate === today);
          if (validAds.length > 0) {
            currentAds = validAds;
            document.getElementById("debugStatus").innerText = `⚡ कैश्ड डेटा सक्रिय (${currentAds.length} विज्ञापन)`;
            playSlide(0);
          }
        } catch (e) {
          console.error("Cache Read Error:", e);
        }
      }
    }

    // B. Firebase से लाइव लिसनर (रियल-टाइम ऑटो-रिफ्रेश)
    function syncWithFirestore() {
      const today = getTodayDateString();
      const debugDiv = document.getElementById("debugStatus");

      db.collection("screen_bookings")
        .where("displayDate", "==", today)
        .onSnapshot((snapshot) => {
          const liveList = [];

          snapshot.forEach((doc) => {
            const data = doc.data();
            const fileId = cleanDriveId(data.driveFileId) || 
                           cleanDriveId(data.driveFileUrl) || 
                           cleanDriveId(data.fileUrl);

            if (fileId) {
              const mediaType = detectMediaType(data);
              liveList.push({
                id: doc.id,
                displayDate: data.displayDate,
                fileId: fileId,
                mediaType: mediaType,
                // डायरेक्ट HD इमेज लिंक (काली स्क्रीन से मुक्ति)
                directImgUrl: `https://drive.google.com/thumbnail?id=${fileId}&sz=w1920`,
                previewUrl: `https://drive.google.com/file/d/${fileId}/preview`,
                category: data.category || 'विशेष सूचना',
                name: data.customerName || ''
              });
            }
          });

          debugDiv.innerText = `🟢 लाइव सिंक: ${liveList.length} विज्ञापन मिले`;
          localStorage.setItem(CACHE_KEY, JSON.stringify(liveList));

          if (liveList.length > 0) {
            currentAds = liveList;
            if (!slideTimer) {
              currentIndex = 0;
              playSlide(currentIndex);
            }
          } else {
            show4DStandbyScreen();
          }
        }, (err) => {
          console.warn("Firebase Offline:", err);
          debugDiv.innerText = `⚠️ ऑफलाइन मोड`;
          if (currentAds.length === 0) loadFromLocalStorage();
        });
    }

    function show4DStandbyScreen() {
      clearTimeout(slideTimer);
      slideTimer = null;
      document.getElementById("mainScreen").innerHTML = `
        <div style="text-align:center; padding: 40px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 2px solid rgba(0, 229, 255, 0.4); border-radius: 25px; box-shadow: 0 0 50px rgba(0, 229, 255, 0.3);">
          <h1 style="font-size: 38px; margin-bottom: 15px; background: linear-gradient(90deg, #00e5ff, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            नगर स्मार्ट डिजिटल डिस्प्ले
          </h1>
          <p style="font-size: 22px; color: #e2e8f0; margin-bottom: 10px;">आज के लिए कोई नया विज्ञापन निर्धारित नहीं है</p>
          <div style="font-size: 19px; color: #00e5ff; margin-top: 15px; font-weight: bold;">
            विज्ञापन बुक करने के लिए हमारी आधिकारिक वेबसाइट पर जाएँ
          </div>
        </div>
      `;
    }

    /* ==========================================================
       4. SMART AUTO-FIT SLIDE PLAYER
       ========================================================== */
    function playSlide(index) {
      if (currentAds.length === 0) {
        show4DStandbyScreen();
        return;
      }

      if (index >= currentAds.length) currentIndex = 0;
      else currentIndex = index;

      const ad = currentAds[currentIndex];
      const mainScreen = document.getElementById("mainScreen");
      mainScreen.innerHTML = "";

      const container = document.createElement("div");
      container.className = "media-container";

      // 🟢 फ़ोटो के लिए: ऑटो-साइजिंग इमेज कंटेनर (चारों तरफ 4D बैकग्राउंड लाइव रहेगा)
      if (ad.mediaType === "image") {
        const autoWrapper = document.createElement("div");
        autoWrapper.className = "auto-media-wrapper";

        const img = document.createElement("img");
        img.src = ad.directImgUrl;

        // यदि थंबनेल लिंक किसी कारण से बाधित हो, तो प्रीव्यू पर स्विच करें
        img.onerror = function() {
          autoWrapper.className = "video-pdf-wrapper";
          autoWrapper.innerHTML = `<iframe src="${ad.previewUrl}" allow="autoplay"></iframe>`;
        };

        autoWrapper.appendChild(img);
        container.appendChild(autoWrapper);
      } else {
        // 🟢 वीडियो या PDF के लिए: फुल-व्यू प्रीव्यू फ्रेम
        const vpWrapper = document.createElement("div");
        vpWrapper.className = "video-pdf-wrapper";

        const iframe = document.createElement("iframe");
        iframe.src = ad.previewUrl;
        iframe.setAttribute("allow", "autoplay");
        vpWrapper.appendChild(iframe);
        container.appendChild(vpWrapper);
      }

      // 3D फ्लोटिंग ओवरले सूचना
      const overlay = document.createElement("div");
      overlay.className = "ad-info-overlay";
      overlay.innerHTML = `✨ ${ad.category} ${ad.name ? ': ' + ad.name : ''} ✨`;
      container.appendChild(overlay);

      mainScreen.appendChild(container);

      clearTimeout(slideTimer);
      slideTimer = setTimeout(() => {
        playSlide(currentIndex + 1);
      }, SLIDE_DURATION);
    }

    // प्रारंभ करें
    loadFromLocalStorage();
    syncWithFirestore();
  </script>
</body>
</html>
