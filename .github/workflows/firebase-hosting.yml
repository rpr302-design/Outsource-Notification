name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 1. Cloud Functions की डिपेंडेंसीज़ इंस्टॉल करें
      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      # 2. Firebase CLI इंस्टॉल करें
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 3. Cloud Functions और Hosting दोनों डिप्लॉय करें
      - name: Deploy Functions and Hosting
        run: firebase deploy --only functions,hosting --project push-notifaction-c3460
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
