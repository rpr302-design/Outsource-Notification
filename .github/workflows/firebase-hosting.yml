name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Functions की डिपेंडेंसी इंस्टॉल करें
      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      # 2. Firebase CLI इंस्टॉल करें
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 3. Google Service Account Auth के ज़रिये Hosting और Functions दोनों डिप्लॉय करें
      - name: Deploy Functions and Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json
          firebase deploy --only functions,hosting --project push-notifaction-c3460
          rm gcp-key.json
